<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Le rond du fil de constellation (navigation) : l'anneau ouvert (ensō), sa pierre de clé, et un grand losange
       de pigment au centre, lisible même à 16 px. Onglets sombres : l'anneau devient clair pour rester visible. -->
  <style>
    .ring { stroke: #2f2e2d; }
    @media (prefers-color-scheme: dark) {
      .ring { stroke: #ecebe9; }
    }
  </style>
  <!-- Anneau ouvert : le pinceau ne referme pas le tour, l'ouverture en haut à droite -->
  <path class="ring" d="M28.59 12.02A13.4 13.4 0 1 1 24.61 6.34" fill="none" stroke-width="2.4" stroke-linecap="round" />
  <!-- Losange de pigment au centre -->
  <path d="M16 9.2 L21.4 16.6 L16 24 L10.6 16.6Z" fill="#b8433b" />
  <!-- Pierre de clé au sommet de l'anneau -->
  <path d="M16 0.4 L18.6 3.3 L16 6.2 L13.4 3.3Z" fill="#b8433b" />
</svg>
